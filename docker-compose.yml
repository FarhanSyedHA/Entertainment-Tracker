# docker-compose.yml defines the services Docker runs together.
# We use TiDB Cloud for the database (defined in .env.development), so no local db service.

services:
  backend:
    build:
      dockerfile: Dockerfile.dev # build from Dockerfile.dev instead of pulling an image
    ports:
      - "8000:8000"
    volumes:
      - .:/app # mount project root so code changes reflect without rebuild

  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      # no depends_on — frontend talks to backend via HTTP, not docker network